<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Sync Tool</title>
    <link href="./style.css" rel="stylesheet" />
  </head>

  <body>
    <main>
      <header id="title">
        <h1>⚡ File Sync Tool</h1>
      </header>

      <div class="card-container">
        <div class="card-button" id="card-a" onclick="selectLocations('a')">
          <button
            type="button"
            class="drop-path"
            id="drop-path-a"
            onclick="
              event.stopPropagation();
              dropLocations('a');
            "
          >
            ⨉
          </button>
          <span class="card-icon">📁</span>
          <span class="card-name" id="name-a">Location A</span>
          <span class="card-path" id="path-a">Click to browse</span>
        </div>

        <div class="secondary-card-wrapper">
          <div class="card-button" id="card-b" onclick="selectLocations('b')">
            <button
              type="button"
              class="drop-path"
              id="drop-path-b"
              onclick="
                event.stopPropagation();
                dropLocations('b');
              "
            >
              ⨉
            </button>
            <span class="card-icon">📁</span>
            <span class="card-name" id="name-b">Location B</span>
            <span class="card-path" id="path-b">Click to browse</span>
          </div>
          <div class="card-button" id="card-c">
            <button
              type="button"
              class="drop-path"
              id="drop-path-c"
              onclick="
                event.stopPropagation();
                dropLocations('c');
              "
            >
              ⨉
            </button>
            <span class="card-icon">☁️</span>
            <span class="card-name">Drive</span>
            <div class="newfolder-container">
              <input type="text" class="newfolder-box" />
              <button class="newfolder-button" onclick="createFolder()">
                +
              </button>
            </div>
            <div class="selectfolder-container">
              <input
                type="checkbox"
                id="selectfolder-box"
                placeholder="New folder"
                onchange="getFolder(this)"
              />
              <label for="selectfolder-box" class="selectfolder-menu">
                <span class="selectfolder-name">Choose a folder</span>
                <span class="selectfolder-arrow">▼</span>
              </label>
              <div class="selectfolder-list">
                <div class="loading-folder">
                  <span>•</span>
                  <span>•</span>
                  <span>•</span>
                </div>
                <ul class="selectfolder-options"></ul>
                <span class="empty-folder">Nothing here</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="cloudtoggle-container">
        <span class="cloudtoggle-name">Cloud</span>
        <input
          type="checkbox"
          id="cloudtoggle-box"
          onchange="authenticateDrive(this)"
        />
        <label for="cloudtoggle-box" class="cloudtoggle-groove">
          <span class="cloudtoggle-slider-outline"> </span>
          <span class="cloudtoggle-slider"></span>
        </label>
      </div>

      <div class="sync-container">
        <button class="sync-button" disabled="true" onclick="sync()">
          Sync
        </button>
        <span class="sync-status" id="sync-status"
          >Please select locations to begin.</span
        >
      </div>

      <div class="progressbar-container">
        <div class="progressbar-lines">
          <span class="progressbar-line"></span>
          <span class="progressbar-line"></span>
          <span class="progressbar-line"></span>
          <span class="progressbar-line"></span>
          <span class="progressbar-line"></span>
          <span class="progressbar-line"></span>
          <span class="progressbar-line"></span>
          <span class="progressbar-line"></span>
          <span class="progressbar-line"></span>
          <span class="progressbar-line"></span>
          <span class="progressbar-line"></span>
          <span class="progressbar-line"></span>
        </div>
      </div>
    </main>

    <div id="exit-modal" class="modal-overlay">
      <div class="modal-box">
        <p>Sync is in progress. Closing now may leave files incomplete.</p>
        <div class="modal-buttons">
          <button onclick="confirmExit()" id="exitbutton-confirm">
            Exit anyway
          </button>
          <button onclick="cancelExit()" id="exitbutton-cancel">Cancel</button>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
