<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Sync Tool</title>
    <link href="./index.css" rel="stylesheet" />
  </head>

  <body>
    <main>
      <header id="title">
        <h1>⚡ File Sync Tool</h1>
      </header>

      <div class="card-container">
        <div class="card-button" id="card-a" onclick="selectA()">
          <span class="card-icon">📁</span>
          <span class="card-name" id="name-a">Location A</span>
          <span class="card-path" id="path-a">Click to browse</span>
        </div>

        <div class="secondary-card-wrapper">
          <div class="card-button" id="card-b" onclick="selectB()">
            <span class="card-icon">📁</span>
            <span class="card-name" id="name-b">Location B</span>
            <span class="card-path" id="path-b">Click to browse</span>
          </div>
          <div class="card-button" id="card-c">
            <span class="card-icon">☁️</span>
            <span class="card-name">Cloud</span>
            <div class="newfolder-container">
              <input type="text" class="newfolder-box" />
              <button class="newfolder-button" onclick="createFolder()">
                +
              </button>
            </div>
            <div class="selectfolder-container">
              <input
                type="checkbox"
                id="selectfolder-box"
                onchange="getFolder(this)"
              />
              <label for="selectfolder-box" class="selectfolder-picker">
                <span class="selectfolder-name">Select cloud folder</span>
                <span class="selectfolder-arrow">▼</span>
              </label>
              <div class="selectfolder-options"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="cloudtoggle-container">
        <span class="cloudtoggle-name">Drive</span>
        <input
          type="checkbox"
          id="cloudtoggle-box"
          onchange="authenticateDrive(this)"
        />
        <label for="cloudtoggle-box" class="cloudtoggle-slider"></label>
      </div>

      <div class="sync-container">
        <button class="sync-button" disabled="true" onclick="sync()">
          <span class="sync-icon">🔄</span>
          Sync
        </button>
        <span class="sync-status" id="sync-status"
          >Please select locations to begin.</span
        >
      </div>

      <div class="progressbar-container">
        <div class="progressbar-line"></div>
      </div>
    </main>

    <script src="./index.js"></script>
  </body>
</html>
